name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # There are no tests; this checks that every source file parses and that
      # the modules load with the installed dependencies.
      - name: Syntax
        run: git ls-files -z '*.js' | xargs -0 -n1 node --check

      - name: Dependencies load
        run: node -e "require('bcrypt'); require('jsonwebtoken'); require('express'); require('mysql'); require('multer')"
