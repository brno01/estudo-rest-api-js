name: claude

# Comment "@claude ..." on a pull request or an issue and Claude answers there.
# Run this workflow by hand and Claude audits the repository and opens issues.
# Only the repository owner can trigger it. Needs the CLAUDE_CODE_OAUTH_TOKEN secret.

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] owner-only, read-only contents, comment and issue writes only
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions: {}

jobs:
  claude:
    if: >-
      ${{ github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@claude')) }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: brno01/.github/.github/workflows/claude.yml@v1
    with:
      audit: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
